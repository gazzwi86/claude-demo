# Playwright E2E against a live Next.js dev server. Heavier than CI so it
# runs on PR + nightly only.
name: E2E

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm -F @looper/web exec playwright install --with-deps chromium

      - name: Bring up DynamoDB Local + LocalStack
        run: docker compose -f infra/docker/docker-compose.yml up -d dynamodb-local localstack

      - name: Seed (idempotent)
        run: docker compose -f infra/docker/docker-compose.yml run --rm init

      - name: Run Playwright (behavioural + visual)
        run: pnpm e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
